# Render Blueprint: the deployed API (continuous deployment).
# The database is PostgreSQL 16 on Neon (not on Render); its connection string is the DATABASE_URL secret.
# Setup steps and how a deploy works: infra/deploy/README.md
services:
  - type: web
    name: digitalmohalla-api
    runtime: docker
    plan: free
    region: singapore            # keep the Neon project in the same region (AWS Singapore)
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    buildFilter:                 # only changes under backend/ trigger a deploy
      paths:
        - backend/**
    branch: main                 # main is what is deployed (team workflow)
    autoDeployTrigger: checksPass  # deploy a commit on main only after the CI checks on it pass
    healthCheckPath: /health     # a new version goes live only if this answers; otherwise the old one stays
    envVars:
      - key: DATABASE_URL        # Neon DIRECT connection string (not the -pooler host), entered in the dashboard
        sync: false
      - key: JWT_SECRET          # random value generated by Render, never stored in the repo
        generateValue: true
      - key: CORS_ORIGINS        # the Android app does not need CORS; no browser origins in deployment
        value: ""
      - key: CORS_ORIGIN_REGEX   # turn off the development default that allows any localhost origin
        value: ""
