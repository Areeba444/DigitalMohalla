# Render Blueprint: the deployed API and the web version of the app (continuous deployment).
# The database is PostgreSQL 16 on Neon (not on Render); its connection string is the DATABASE_URL secret.
# Setup steps and how a deploy works: infra/deploy/README.md
services:
  - type: web
    name: digitalmohalla-api
    runtime: docker
    plan: free
    region: singapore            # keep the Neon project in the same region (AWS Singapore)
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    buildFilter:                 # only changes under backend/ trigger a deploy
      paths:
        - backend/**
    branch: main                 # main is what is deployed (team workflow)
    autoDeployTrigger: checksPass  # deploy a commit on main only after the CI checks on it pass
    healthCheckPath: /health     # a new version goes live only if this answers; otherwise the old one stays
    envVars:
      - key: DATABASE_URL        # Neon DIRECT connection string (not the -pooler host), entered in the dashboard
        sync: false
      - key: JWT_SECRET          # random value generated by Render, never stored in the repo
        generateValue: true
      - key: CORS_ORIGINS        # only the deployed web app may call the API from a browser (Android needs no CORS)
        value: https://digitalmohalla-web.onrender.com
      - key: CORS_ORIGIN_REGEX   # turn off the development default that allows any localhost origin
        value: ""

  # Web version of the Expo app: static files on Render's CDN (free, does not sleep).
  - type: web
    name: digitalmohalla-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:                 # only changes under frontend/ trigger a rebuild
      paths:
        - frontend/**
    buildCommand: cd frontend && npm ci --legacy-peer-deps && npx expo export --platform web
    staticPublishPath: ./frontend/dist
    routes:                      # paths with no file (e.g. /login, /item/<id>) get index.html; Expo Router reads the URL
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL # built into the JavaScript bundle at build time
        value: https://digitalmohalla-api.onrender.com
      - key: NODE_VERSION        # same Node.js as CI
        value: "24"
