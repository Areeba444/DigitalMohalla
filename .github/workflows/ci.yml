# Continuous integration: every push and pull request is checked on a clean machine.
#
# Plain-language summary of the jobs (they run in parallel):
#   backend     lint, format, types, security scan, then every backend test against a throwaway
#               PostgreSQL 16 (unit, integration, the synthetic-data generator and the dataset load)
#   frontend    clean install, type check, lint, Jest tests
#   api-client  re-exports the backend's OpenAPI spec and regenerates the typed frontend client;
#               fails if either differs from what is committed (frontend and backend cannot drift)
# A red cross on a job means that check failed; open the job to see the log.
# CD (images, deployment) is not here yet: it waits for the hosting decision (ADR-0006).

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# a newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # throwaway container that exists only for this job; not a real secret
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: digitalmohalla_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci_only_password@localhost:5432/digitalmohalla_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check . ../data/generators ../scripts

      - name: Format check (ruff)
        run: uv run ruff format --check . ../data/generators ../scripts

      - name: Type check (mypy, engine and lifecycle packages)
        run: uv run mypy app/domain

      - name: Security scan (bandit)
        run: uv run bandit -q -r app

      - name: Known vulnerabilities in dependencies (pip-audit, warning only)
        continue-on-error: true
        run: uv run pip-audit

      - name: Tests (unit, integration with PostgreSQL, data generator, dataset load)
        run: >-
          uv run pytest
          --junitxml=reports/junit.xml
          --cov=app --cov-report=term --cov-report=xml:reports/coverage.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps: the Expo template ships TypeScript 6 while openapi-typescript asks for 5
      - name: Install dependencies (exactly as locked)
        run: npm ci --legacy-peer-deps

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Lint (ESLint via expo lint)
        run: npx expo lint

      - name: Tests (Jest)
        run: npx jest --ci

      - name: Known vulnerabilities in dependencies (npm audit, warning only)
        continue-on-error: true
        run: npm audit --audit-level=high

  api-client:
    name: API client in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Export the backend's OpenAPI spec
        working-directory: backend
        run: |
          uv sync --locked
          uv run python ../scripts/export_openapi.py ../frontend/src/api/openapi.json

      - name: Regenerate the typed client
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run api:generate

      - name: Fail if the committed client is out of date
        run: |
          git diff --exit-code -- frontend/src/api/openapi.json frontend/src/api/schema.d.ts \
            || (echo "::error::The API changed. Run scripts/export_openapi.py and npm run api:generate, then commit both files." && exit 1)
